<div class="chat-layout">

  <!-- Sidebar -->
  <side-bar></side-bar>

  <main class="main">
    @if (!currentChatId()) {
      <div class="placeholder">
        <p>Select a chat or create a new one</p>
      </div>
    } @else {
      <div class="conversation">

        @if (currentChatId()) {
          <chat-title-editor></chat-title-editor>
        }

        <div class="tree">
          @for (node of getActivePath(); track node.id) {
            <app-chat-node
              [node]="node"
              [activeChildId]="getActiveChildId(node.parentId)"
              (activate)="setActiveChild(node.parentId, $event)"
            />
          }
        </div>

        <!-- Composer -->
        <div class="composer">
          <div class="composer-row">
            <select [ngModel]="selectedModelId()" (ngModelChange)="setSelectedModelId($event)">
              <option value="">Select model…</option>
              @for (model of enabledModels(); track model.id) {
                <option [value]="model.id">{{ model.displayName }}</option>
              }
            </select>
          </div>

          <textarea
            rows="3"
            placeholder="Write your question… (Ctrl+Enter to send)"
            [ngModel]="newQuestion()"
            (ngModelChange)="newQuestion.set($event)"
            (keydown.control.enter)="addRootQuestion()">
          </textarea>

          <div class="composer-actions">
            <span class="hint">Ctrl + Enter to send</span>
            <button
              class="btn primary"
              [disabled]="isLoading() || !newQuestion().trim() || !selectedModelId()"
              (click)="addRootQuestion()">
              {{ isLoading() ? 'Sending…' : 'Send question' }}
            </button>
          </div>
        </div>

      </div>
    }
  </main>

</div>
