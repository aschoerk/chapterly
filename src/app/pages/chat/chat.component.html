<div class="chat-layout">
  <div class="sidebar-pane" [style.width.px]="sidebarWidth()">
    <side-bar></side-bar>
  </div>

  <div
    class="sidebar-resizer"
    [class.active]="isResizing()"
    (pointerdown)="startSidebarResize($event)"
    (dblclick)="resetSidebarWidth()"
    title="Drag to resize sidebar">
  </div>


  <main class="main">
    @if (!currentChatId()) {
      <div class="placeholder">
        <p>Select a chat or create a new one</p>
      </div>
    } @else {
      <div class="conversation">

        @if (currentChatId()) {
          <chat-title-editor></chat-title-editor>

          @if (getActivePath().length > 0) {
            <div class="node-nav-bar">
              <div class="nav-path">
                <button class="btn-icon" type="button" title="Book View"
                        (click)="openReader()"
                        [disabled]="!currentChatId()"
                        title="Open book view (Ctrl-B)">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                       stroke="currentColor" stroke-width="2"
                       stroke-linecap="round" stroke-linejoin="round"
                       aria-hidden="true">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                    <path d="M4 4.5A2.5 2.5 0 0 1 6.5 7H20v13H6.5A2.5 2.5 0 0 0 4 22.5z"/>
                    <path d="M12 7v13"/>
                  </svg>
                </button>
                @for (node of getActivePath(); track node.id; let i = $index) {
                  <button
                    class="nav-node"
                    [class.question]="node.type === 'question'"
                    [class.answer]="node.type === 'answer'"
                    [class.active]="isNearViewport(node.id)"
                    (click)="scrollToNode(node.id)"
                    [title]="node.content.slice(0, 120)">

                    <span class="nav-badge">{{ node.type === 'question' ? 'Q' : 'A' }}</span>

                    @if (getChildren(node.parentId).length > 1) {
                      <span class="nav-branch-count">
                        {{ getSiblingIndex(node) }} / {{ getChildren(node.parentId).length }}
                      </span>
                    }
                  </button>

                  @if (i < getActivePath().length - 1) {
                    <span class="nav-separator">›</span>
                  }
                }
              </div>
            </div>
          }
        }

        <div class="tree" #tree (scroll)="onTreeScroll()">
          @for (node of getActivePath(); track node.id) {
            <app-chat-node
              [node]="node"
              [activeChildId]="getActiveChildId(node.parentId)"
              (activate)="setActiveChild(node.parentId, $event)"
            />
          }
        </div>

      </div>
    }
  </main>

</div>
