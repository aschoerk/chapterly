<div class="chat-layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>Chats</h2>
      <div class="header-actions">
        <button class="btn" (click)="goToConfig()" title="Configuration">⚙</button>
        <button class="btn primary" (click)="createChat()">+ New</button>
      </div>
    </div>

    <div class="chat-list">
      @for (chat of chats(); track chat.id) {
        <div
          class="chat-item"
          [class.active]="chat.id === currentChatId()"
          (click)="selectChat(chat)">
          <span class="chat-title">{{ chat.title }}</span>
          <button class="btn-icon" (click)="deleteChat(chat, $event)" title="Delete">×</button>
        </div>
      } @empty {
        <p class="empty">No chats yet</p>
      }
    </div>
  </aside>

  <main class="main">
    @if (!currentChatId()) {
      <div class="placeholder">
        <p>Select a chat or create a new one</p>
      </div>
    } @else {
      <div class="conversation">

        @if (currentChatId()) {
          <chat-title-editor></chat-title-editor>
        }

        <div class="tree">
          @for (node of getActivePath(); track node.id) {
            <app-chat-node
              [node]="node"
              [activeChildId]="getActiveChildId(node.parentId)"
              (activate)="setActiveChild(node.parentId, $event)"
            />
          }
        </div>

        <!-- Composer -->
        <div class="composer">
          <div class="composer-row">
            <select [ngModel]="selectedModelId()" (ngModelChange)="selectedModelId.set($event)">
              <option value="">Select model…</option>
              @for (model of enabledModels(); track model.id) {
                <option [value]="model.id">{{ model.displayName }}</option>
              }
            </select>
          </div>

          <textarea
            rows="3"
            placeholder="Write your question… (Ctrl+Enter to send)"
            [ngModel]="newQuestion()"
            (ngModelChange)="newQuestion.set($event)"
            (keydown.control.enter)="addRootQuestion()">
          </textarea>

          <div class="composer-actions">
            <span class="hint">Ctrl + Enter to send</span>
            <button
              class="btn primary"
              [disabled]="isLoading() || !newQuestion().trim() || !selectedModelId()"
              (click)="addRootQuestion()">
              {{ isLoading() ? 'Sending…' : 'Send question' }}
            </button>
          </div>
        </div>

      </div>
    }
  </main>

</div>
