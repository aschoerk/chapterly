<div class="login-page">
  <form class="card" (ngSubmit)="submit()">
    <h1>Chapterly</h1>
    <p class="hint">{{ i18n.t('login.hint') }}</p>

    <label>
      {{ i18n.t('login.username') }}
      <input name="username" [(ngModel)]="username" autocomplete="username" required />
    </label>
    <label>
      {{ i18n.t('login.password') }}
      <input name="password" type="password" [(ngModel)]="password" autocomplete="current-password" required />
    </label>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <button class="btn primary" type="submit" [disabled]="busy() || !username || !password">
      {{ busy() ? i18n.t('login.signingIn') : i18n.t('login.signIn') }}
    </button>
    @if (googleEnabled()) {
      <button class="btn google" type="button" (click)="google()" [disabled]="busy()">
        {{ i18n.t('login.google') }}
      </button>
    }
    <button class="btn" type="button" (click)="skip()">{{ i18n.t('login.skip') }}</button>
  </form>
</div>
