<div class="avatar-section">
  <label>{{ label }}</label>
  <div class="avatar-row">
    <div class="preview">
      <app-avatar-view [value]="value" [fallback]="placeholder" [alt]="label" />
    </div>

    <div class="avatar-controls">
      <label class="btn small file-btn">
        Choose image…
        <input type="file" accept="image/*" (change)="onFileSelected($event)" hidden />
      </label>

      <button type="button" class="btn small" (click)="togglePalette()">
        {{ showPalette() ? 'Hide emojis' : 'Use emoji' }}
      </button>

      @if (value) {
        <button type="button" class="btn small" (click)="clear()">Remove</button>
      }
    </div>
  </div>

  @if (showPalette()) {
    <div class="emoji-tools">
      <input
        class="emoji-input"
        type="text"
        [ngModel]="emojiDraft()"
        (ngModelChange)="onEmojiTyped($event)"
        placeholder="Paste or type an emoji — Win+. / Ctrl-Cmd-Space"
        maxlength="16"
        autocomplete="off"
        spellcheck="false"
      />

      <div class="block-nav">
        <button
          type="button"
          class="btn small nav-btn"
          (click)="prevBlock()"
          title="Previous group"
          aria-label="Previous emoji group"
        >
          ‹
        </button>
        <div class="block-heading">
          <strong>{{ currentBlock().name }}</strong>
          <span class="block-index">{{ blockLabel() }}</span>
        </div>
        <button
          type="button"
          class="btn small nav-btn"
          (click)="nextBlock()"
          title="Next group"
          aria-label="Next emoji group"
        >
          ›
        </button>
      </div>

      <div
        class="emoji-grid"
        role="listbox"
        [attr.aria-label]="currentBlock().name"
      >
        @for (emoji of currentBlock().emojis; track $index) {
          <button
            type="button"
            class="emoji-btn"
            [class.selected]="value === emoji"
            (click)="pickEmoji(emoji)"
            [title]="emoji"
          >
            {{ emoji }}
          </button>
        }
      </div>
    </div>
  }

  <p class="hint">{{ hint }}</p>
</div>
