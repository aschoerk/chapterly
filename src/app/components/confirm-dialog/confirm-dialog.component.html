@if (confirm.current(); as d) {
  <div class="confirm-backdrop" (click)="onBackdrop($event)" (keydown)="onKey($event)" tabindex="0">
    <div class="confirm-card" role="alertdialog" aria-modal="true"
         [attr.aria-labelledby]="'confirm-title'"
         (click)="$event.stopPropagation()">
      <h3 id="confirm-title">{{ d.title }}</h3>
      <p>{{ d.message }}</p>
      <div class="confirm-actions">
        <button class="btn" type="button" (click)="confirm.close(false)">
          {{ d.cancelLabel }}
        </button>
        <button class="btn primary" type="button"
                [class.danger]="d.danger"
                (click)="confirm.close(true)">
          {{ d.confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
