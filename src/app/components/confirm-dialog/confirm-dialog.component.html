@if (confirm.current(); as d) {
  <div
    class="confirm-backdrop"
    (click)="onBackdrop($event)"
    (keydown)="onKey($event)"
    tabindex="0"
  >
    <div
      class="confirm-dialog"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="confirm-title"
      aria-describedby="confirm-message"
      (click)="$event.stopPropagation()"
    >
      <h3 id="confirm-title">{{ d.title }}</h3>
      <p id="confirm-message" class="confirm-message">{{ d.message }}</p>
      <div class="confirm-actions">
        <button class="btn" type="button" (click)="confirm.close(false)">
          {{ d.cancelLabel }}
        </button>
        <button
          class="btn primary"
          type="button"
          [class.danger]="d.danger"
          (click)="confirm.close(true)"
        >
          {{ d.confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
